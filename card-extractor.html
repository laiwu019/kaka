<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>卡密提取器</title>
    <style>
        :root {
            --bg-deep: #05070C;
            --bg-base: #0A0D12;
            --bg-raised: #0F131C;
            --bg-elevated: #161D2B;
            --bg-overlay: #1E2636;
            --accent: #38BDF8;
            --accent-dim: #0EA5E9;
            --text-primary: #F8FAFC;
            --text-secondary: #94A3B8;
            --success: #6EE7B7;
            --radius-pill: 999px;
            --radius-card: 16px;
            --spacing-sm: clamp(8px, 1.5vw, 12px);
            --spacing-md: clamp(16px, 3vw, 24px);
            --spacing-lg: clamp(24px, 4vw, 36px);
            --font-display: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            --size-display: clamp(24px, 5vw, 32px);
            --size-title: clamp(18px, 3.5vw, 22px);
            --size-body: clamp(14px, 2.5vw, 16px);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-body);
            font-size: var(--size-body);
            background: var(--bg-deep);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
            padding: var(--spacing-md);
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        h1 {
            font-family: var(--font-display);
            font-size: var(--size-display);
            font-weight: 600;
            letter-spacing: -0.02em;
            margin-bottom: var(--spacing-lg);
            text-align: center;
        }

        .card {
            background: var(--bg-raised);
            border-radius: var(--radius-card);
            padding: var(--spacing-lg);
            margin-bottom: var(--spacing-md);
        }

        .extract-zone {
            display: grid;
            gap: var(--spacing-md);
            margin-bottom: var(--spacing-lg);
        }

        .code-display {
            background: var(--bg-elevated);
            border-radius: var(--radius-card);
            padding: var(--spacing-lg);
            min-height: 120px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: var(--spacing-sm);
            cursor: pointer;
            transition: background 0.2s;
        }

        .code-display:hover {
            background: var(--bg-overlay);
        }

        .code-text {
            font-family: 'SF Mono', 'Monaco', 'Consolas', monospace;
            font-size: var(--size-title);
            color: var(--accent);
            word-break: break-all;
            text-align: center;
        }

        .code-hint {
            font-size: calc(var(--size-body) * 0.875);
            color: var(--text-secondary);
        }

        .btn {
            background: var(--accent);
            color: var(--bg-deep);
            border: none;
            border-radius: var(--radius-pill);
            padding: 14px 28px;
            font-size: var(--size-body);
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: all 0.2s;
        }

        .btn:hover {
            background: var(--accent-dim);
            transform: translateY(-1px);
        }

        .btn:active {
            transform: translateY(0);
        }

        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--spacing-md);
            margin-bottom: var(--spacing-lg);
        }

        .stat-card {
            background: var(--bg-base);
            border-radius: var(--radius-card);
            padding: var(--spacing-md);
            text-align: center;
        }

        .stat-value {
            font-size: var(--size-title);
            font-weight: 600;
            color: var(--accent);
        }

        .stat-label {
            font-size: calc(var(--size-body) * 0.875);
            color: var(--text-secondary);
            margin-top: 4px;
        }

        .import-zone {
            margin-top: var(--spacing-lg);
        }

        textarea {
            width: 100%;
            min-height: 120px;
            background: var(--bg-elevated);
            border: 1px solid transparent;
            border-radius: var(--radius-card);
            padding: var(--spacing-md);
            color: var(--text-primary);
            font-family: 'SF Mono', 'Monaco', 'Consolas', monospace;
            font-size: var(--size-body);
            resize: vertical;
            margin-bottom: var(--spacing-md);
        }

        textarea:focus {
            outline: none;
            border-color: var(--accent);
        }

        .toast {
            position: fixed;
            top: var(--spacing-md);
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: var(--success);
            color: var(--bg-deep);
            padding: 12px 24px;
            border-radius: var(--radius-pill);
            font-weight: 600;
            opacity: 0;
            transition: all 0.3s;
            z-index: 1000;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        .btn-secondary {
            background: var(--bg-elevated);
            color: var(--text-primary);
        }

        .btn-secondary:hover {
            background: var(--bg-overlay);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎫 卡密提取器</h1>

        <div class="stats">
            <div class="stat-card">
                <div class="stat-value" id="monthCount">0</div>
                <div class="stat-label">月卡剩余</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="yearCount">0</div>
                <div class="stat-label">年卡剩余</div>
            </div>
        </div>

        <div class="card extract-zone">
            <div class="code-display" id="codeDisplay" onclick="copyCode()">
                <div class="code-text" id="codeText">选择下方按钮提取卡密</div>
                <div class="code-hint" id="codeHint">等待提取...</div>
            </div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: var(--spacing-md);">
                <button class="btn" onclick="extractCode('month')">提取月卡</button>
                <button class="btn" onclick="extractCode('year')">提取年卡</button>
            </div>
        </div>

        <div class="card import-zone">
            <h2 style="font-size: var(--size-title); margin-bottom: var(--spacing-md);">批量导入</h2>
            <div style="margin-bottom: var(--spacing-md);">
                <label style="display: block; margin-bottom: 8px; color: var(--text-secondary);">选择类型：</label>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: var(--spacing-sm);">
                    <button class="btn btn-secondary" id="typeMonth" onclick="selectType('month')" style="background: var(--accent); color: var(--bg-deep);">月卡</button>
                    <button class="btn btn-secondary" id="typeYear" onclick="selectType('year')">年卡</button>
                </div>
            </div>
            <textarea id="importInput" placeholder="每行一个卡密&#10;例如：&#10;ABCD-1234-EFGH&#10;IJKL-5678-MNOP"></textarea>
            <button class="btn" onclick="importCodes()">导入卡密</button>
            <button class="btn btn-secondary" onclick="clearAll()" style="margin-top: var(--spacing-sm);">清空所有</button>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        const STORAGE_KEY = 'card_codes';
        let currentCode = null;
        let selectedType = 'month';

        function loadCodes() {
            const stored = localStorage.getItem(STORAGE_KEY);
            return stored ? JSON.parse(stored) : { month: [], year: [] };
        }

        function saveCodes(codes) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(codes));
            updateStats();
        }

        function updateStats() {
            const codes = loadCodes();
            const monthUnused = codes.month.filter(c => !c.used);
            const yearUnused = codes.year.filter(c => !c.used);
            document.getElementById('monthCount').textContent = monthUnused.length;
            document.getElementById('yearCount').textContent = yearUnused.length;
        }

        function selectType(type) {
            selectedType = type;
            document.getElementById('typeMonth').style.background = type === 'month' ? 'var(--accent)' : 'var(--bg-elevated)';
            document.getElementById('typeMonth').style.color = type === 'month' ? 'var(--bg-deep)' : 'var(--text-primary)';
            document.getElementById('typeYear').style.background = type === 'year' ? 'var(--accent)' : 'var(--bg-elevated)';
            document.getElementById('typeYear').style.color = type === 'year' ? 'var(--bg-deep)' : 'var(--text-primary)';
        }

        function extractCode(type) {
            const codes = loadCodes();
            const unused = codes[type].filter(c => !c.used);

            if (unused.length === 0) {
                showToast(`没有可用的${type === 'month' ? '月卡' : '年卡'}了！`);
                return;
            }

            const code = unused[0];
            currentCode = code.code;

            document.getElementById('codeText').textContent = code.code;
            document.getElementById('codeHint').textContent = '点击复制';

            code.used = true;
            saveCodes(codes);
            showToast(`提取成功！点击卡密复制`);
        }

        function copyCode() {
            if (!currentCode) {
                showToast('请先提取卡密');
                return;
            }

            if (navigator.clipboard) {
                navigator.clipboard.writeText(currentCode).then(() => {
                    showToast('已复制到剪贴板！');
                });
            } else {
                const textarea = document.createElement('textarea');
                textarea.value = currentCode;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                showToast('已复制到剪贴板！');
            }
        }

        function importCodes() {
            const input = document.getElementById('importInput').value.trim();
            if (!input) {
                showToast('请输入卡密');
                return;
            }

            const newCodes = input.split('\n')
                .map(line => line.trim())
                .filter(line => line.length > 0)
                .map(code => ({ code, used: false }));

            if (newCodes.length === 0) {
                showToast('没有有效的卡密');
                return;
            }

            const codes = loadCodes();
            codes[selectedType].push(...newCodes);
            saveCodes(codes);

            document.getElementById('importInput').value = '';
            showToast(`成功导入 ${newCodes.length} 个${selectedType === 'month' ? '月卡' : '年卡'}`);
        }

        function clearAll() {
            if (confirm('确定要清空所有卡密吗？此操作不可恢复！')) {
                localStorage.removeItem(STORAGE_KEY);
                currentCode = null;
                document.getElementById('codeText').textContent = '选择下方按钮提取卡密';
                document.getElementById('codeHint').textContent = '等待提取...';
                updateStats();
                showToast('已清空所有卡密');
            }
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2000);
        }

        updateStats();
    </script>
</body>
</html>
