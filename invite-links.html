<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>邀请链接生成器</title>
    <style>
        :root {
            --bg-deep: #05070C;
            --bg-base: #0A0D12;
            --bg-raised: #0F131C;
            --bg-elevated: #161D2B;
            --bg-overlay: #1E2636;
            --accent: #6EE7B7;
            --accent-dim: #34D399;
            --text-primary: #F8FAFC;
            --text-secondary: #94A3B8;
            --success: #38BDF8;
            --danger: #F87171;
            --radius-pill: 999px;
            --radius-card: 16px;
            --spacing-sm: clamp(8px, 1.5vw, 12px);
            --spacing-md: clamp(16px, 3vw, 24px);
            --spacing-lg: clamp(24px, 4vw, 36px);
            --font-display: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            --size-display: clamp(24px, 5vw, 32px);
            --size-title: clamp(18px, 3.5vw, 22px);
            --size-body: clamp(14px, 2.5vw, 16px);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-body);
            font-size: var(--size-body);
            background: var(--bg-deep);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
            padding: var(--spacing-md);
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        h1 {
            font-family: var(--font-display);
            font-size: var(--size-display);
            font-weight: 600;
            letter-spacing: -0.02em;
            margin-bottom: var(--spacing-lg);
            text-align: center;
        }

        .card {
            background: var(--bg-raised);
            border-radius: var(--radius-card);
            padding: var(--spacing-lg);
            margin-bottom: var(--spacing-md);
        }

        .input-group {
            margin-bottom: var(--spacing-md);
        }

        label {
            display: block;
            margin-bottom: var(--spacing-sm);
            color: var(--text-secondary);
            font-size: calc(var(--size-body) * 0.875);
        }

        input[type="text"], input[type="url"] {
            width: 100%;
            background: var(--bg-elevated);
            border: 1px solid transparent;
            border-radius: var(--radius-card);
            padding: 14px var(--spacing-md);
            color: var(--text-primary);
            font-size: var(--size-body);
        }

        input:focus {
            outline: none;
            border-color: var(--accent);
        }

        .btn {
            background: var(--accent);
            color: var(--bg-deep);
            border: none;
            border-radius: var(--radius-pill);
            padding: 14px 28px;
            font-size: var(--size-body);
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: all 0.2s;
        }

        .btn:hover {
            background: var(--accent-dim);
            transform: translateY(-1px);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background: var(--bg-elevated);
            color: var(--text-primary);
        }

        .btn-secondary:hover {
            background: var(--bg-overlay);
        }

        .btn-danger {
            background: var(--danger);
            color: var(--text-primary);
        }

        .customer-list {
            display: grid;
            gap: var(--spacing-sm);
            max-height: 60vh;
            overflow-y: auto;
        }

        .customer-item {
            background: var(--bg-elevated);
            border-radius: var(--radius-card);
            padding: var(--spacing-md);
            display: grid;
            gap: var(--spacing-sm);
        }

        .customer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .customer-name {
            font-weight: 600;
            font-size: var(--size-title);
            color: var(--accent);
        }

        .delete-btn {
            background: transparent;
            border: none;
            color: var(--danger);
            cursor: pointer;
            font-size: 20px;
            padding: 4px 8px;
        }

        .link-display {
            background: var(--bg-overlay);
            border-radius: 12px;
            padding: 12px;
            font-family: 'SF Mono', 'Monaco', 'Consolas', monospace;
            font-size: calc(var(--size-body) * 0.875);
            word-break: break-all;
            color: var(--success);
            cursor: pointer;
            transition: background 0.2s;
        }

        .link-display:hover {
            background: var(--bg-raised);
        }

        .copy-hint {
            font-size: calc(var(--size-body) * 0.75);
            color: var(--text-secondary);
            text-align: center;
            margin-top: 4px;
        }

        .empty-state {
            text-align: center;
            color: var(--text-secondary);
            padding: var(--spacing-lg);
        }

        .toast {
            position: fixed;
            top: var(--spacing-md);
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: var(--success);
            color: var(--bg-deep);
            padding: 12px 24px;
            border-radius: var(--radius-pill);
            font-weight: 600;
            opacity: 0;
            transition: all 0.3s;
            z-index: 1000;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        .stats {
            text-align: center;
            color: var(--text-secondary);
            margin-bottom: var(--spacing-md);
            font-size: calc(var(--size-body) * 0.875);
        }

        .stats-number {
            color: var(--accent);
            font-weight: 600;
            font-size: var(--size-title);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔗 邀请链接生成器</h1>

        <div class="card">
            <div class="input-group">
                <label>邀请链接模板</label>
                <input type="url" id="baseUrl" placeholder="例如：https://example.com/invite?ref=" value="https://example.com/invite?ref=">
            </div>

            <div class="input-group">
                <label>搜索顾客</label>
                <input type="text" id="searchInput" placeholder="输入顾客名称搜索..." oninput="handleSearch()">
            </div>

            <div class="stats">
                共 <span class="stats-number" id="totalCount">0</span> 个顾客
                <span id="searchStats"></span>
            </div>

            <div class="customer-list" id="customerList">
                <div class="empty-state">还没有导入顾客</div>
            </div>
        </div>

        <div class="card">
            <h2 style="font-size: var(--size-title); margin-bottom: var(--spacing-md);">批量导入顾客</h2>
            <textarea id="importInput" placeholder="每行一个顾客名称&#10;例如：&#10;张三&#10;李四&#10;王五" style="width: 100%; min-height: 120px; background: var(--bg-elevated); border: 1px solid transparent; border-radius: var(--radius-card); padding: var(--spacing-md); color: var(--text-primary); font-size: var(--size-body); resize: vertical; margin-bottom: var(--spacing-md);"></textarea>
            <button class="btn" onclick="importCustomers()">导入顾客</button>
            <button class="btn btn-danger" onclick="clearAll()" style="margin-top: var(--spacing-sm);">清空所有</button>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        const STORAGE_KEY = 'invite_customers';
        let allCustomers = [];

        function loadCustomers() {
            const stored = localStorage.getItem(STORAGE_KEY);
            allCustomers = stored ? JSON.parse(stored) : [];
            return allCustomers;
        }

        function saveCustomers(customers) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(customers));
            allCustomers = customers;
            renderList(customers);
        }

        function loadBaseUrl() {
            return localStorage.getItem('invite_base_url') || 'https://example.com/invite?ref=';
        }

        function saveBaseUrl(url) {
            localStorage.setItem('invite_base_url', url);
        }

        function handleSearch() {
            const keyword = document.getElementById('searchInput').value.trim().toLowerCase();

            if (!keyword) {
                renderList(allCustomers);
                document.getElementById('searchStats').textContent = '';
                return;
            }

            const filtered = allCustomers.filter(c =>
                c.name.toLowerCase().includes(keyword)
            );

            renderList(filtered);
            document.getElementById('searchStats').innerHTML =
                `, 找到 <span class="stats-number">${filtered.length}</span> 个匹配`;
        }

        function importCustomers() {
            const input = document.getElementById('importInput').value.trim();

            if (!input) {
                showToast('请输入顾客名称');
                return;
            }

            const newNames = input.split('\n')
                .map(line => line.trim())
                .filter(line => line.length > 0);

            if (newNames.length === 0) {
                showToast('没有有效的顾客名称');
                return;
            }

            const customers = loadCustomers();
            const existingNames = new Set(customers.map(c => c.name));
            let addedCount = 0;

            newNames.forEach(name => {
                if (!existingNames.has(name)) {
                    customers.push({ name, timestamp: Date.now() });
                    existingNames.add(name);
                    addedCount++;
                }
            });

            saveCustomers(customers);
            document.getElementById('importInput').value = '';
            document.getElementById('searchInput').value = '';
            showToast(`成功导入 ${addedCount} 个顾客` + (newNames.length > addedCount ? `，${newNames.length - addedCount} 个已存在` : ''));
        }

        function deleteCustomer(name) {
            if (!confirm(`确定删除顾客「${name}」吗？`)) {
                return;
            }

            let customers = loadCustomers();
            customers = customers.filter(c => c.name !== name);
            saveCustomers(customers);
            document.getElementById('searchInput').value = '';
            showToast('已删除');
        }

        function copyLink(name) {
            const baseUrl = document.getElementById('baseUrl').value.trim();

            if (!baseUrl) {
                showToast('请先设置邀请链接模板');
                return;
            }

            saveBaseUrl(baseUrl);

            const link = baseUrl + encodeURIComponent(name);

            if (navigator.clipboard) {
                navigator.clipboard.writeText(link).then(() => {
                    showToast(`已复制「${name}」的邀请链接`);
                });
            } else {
                const textarea = document.createElement('textarea');
                textarea.value = link;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                showToast(`已复制「${name}」的邀请链接`);
            }
        }

        function clearAll() {
            if (!confirm('确定清空所有顾客吗？此操作不可恢复！')) {
                return;
            }

            localStorage.removeItem(STORAGE_KEY);
            allCustomers = [];
            document.getElementById('searchInput').value = '';
            renderList([]);
            showToast('已清空');
        }

        function renderList(customers) {
            const container = document.getElementById('customerList');
            const totalCount = document.getElementById('totalCount');
            const baseUrl = document.getElementById('baseUrl').value.trim();

            totalCount.textContent = allCustomers.length;

            if (customers.length === 0) {
                container.innerHTML = '<div class="empty-state">' +
                    (allCustomers.length === 0 ? '还没有导入顾客' : '没有找到匹配的顾客') +
                    '</div>';
                return;
            }

            container.innerHTML = customers.map(customer => {
                const link = baseUrl + encodeURIComponent(customer.name);
                return `
                    <div class="customer-item">
                        <div class="customer-header">
                            <div class="customer-name">${customer.name}</div>
                            <button class="delete-btn" onclick="deleteCustomer('${customer.name.replace(/'/g, "\\'")}')">×</button>
                        </div>
                        <div class="link-display" onclick="copyLink('${customer.name.replace(/'/g, "\\'")}')">${link}</div>
                        <div class="copy-hint">点击复制链接</div>
                    </div>
                `;
            }).join('');
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2000);
        }

        document.getElementById('baseUrl').value = loadBaseUrl();
        document.getElementById('baseUrl').addEventListener('input', () => {
            handleSearch();
        });

        loadCustomers();
        renderList(allCustomers);
    </script>
</body>
</html>
