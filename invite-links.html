<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>邀请链接提取器</title>
    <style>
        :root {
            --bg-deep: #05070C;
            --bg-base: #0A0D12;
            --bg-raised: #0F131C;
            --bg-elevated: #161D2B;
            --bg-overlay: #1E2636;
            --accent: #6EE7B7;
            --accent-dim: #34D399;
            --text-primary: #F8FAFC;
            --text-secondary: #94A3B8;
            --success: #38BDF8;
            --danger: #F87171;
            --radius-pill: 999px;
            --radius-card: 16px;
            --spacing-sm: clamp(8px, 1.5vw, 12px);
            --spacing-md: clamp(16px, 3vw, 24px);
            --spacing-lg: clamp(24px, 4vw, 36px);
            --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            --font-mono: "SF Mono", Monaco, Consolas, monospace;
            --size-display: clamp(24px, 5vw, 32px);
            --size-title: clamp(18px, 3.5vw, 22px);
            --size-body: clamp(14px, 2.5vw, 16px);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: var(--font-body);
            font-size: var(--size-body);
            background: var(--bg-deep);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
            padding: var(--spacing-md);
        }
        .container { max-width: 600px; margin: 0 auto; }
        h1 {
            font-size: var(--size-display);
            font-weight: 600;
            letter-spacing: -0.02em;
            margin-bottom: var(--spacing-lg);
            text-align: center;
        }
        .card {
            background: var(--bg-raised);
            border-radius: var(--radius-card);
            padding: var(--spacing-lg);
            margin-bottom: var(--spacing-md);
        }
        .card-title {
            font-size: var(--size-title);
            font-weight: 600;
            margin-bottom: var(--spacing-md);
        }
        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--spacing-md);
            margin-bottom: var(--spacing-lg);
        }
        .stat-card {
            background: var(--bg-base);
            border-radius: var(--radius-card);
            padding: var(--spacing-md);
            text-align: center;
        }
        .stat-value { font-size: var(--size-title); font-weight: 600; color: var(--accent); }
        .stat-label { font-size: calc(var(--size-body) * 0.875); color: var(--text-secondary); margin-top: 4px; }
        .link-display {
            background: var(--bg-elevated);
            border-radius: var(--radius-card);
            padding: var(--spacing-lg);
            min-height: 120px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: var(--spacing-sm);
            cursor: pointer;
            transition: background 0.2s;
            margin-bottom: var(--spacing-md);
        }
        .link-display:hover { background: var(--bg-overlay); }
        .link-text {
            font-family: var(--font-mono);
            font-size: calc(var(--size-body) * 0.95);
            color: var(--accent);
            word-break: break-all;
            text-align: center;
        }
        .link-hint { font-size: calc(var(--size-body) * 0.875); color: var(--text-secondary); }
        .btn {
            background: var(--accent);
            color: var(--bg-deep);
            border: none;
            border-radius: var(--radius-pill);
            padding: 14px 28px;
            font-size: var(--size-body);
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: all 0.2s;
        }
        .btn:hover { background: var(--accent-dim); }
        .btn-secondary { background: var(--bg-elevated); color: var(--text-primary); }
        .btn-secondary:hover { background: var(--bg-overlay); }
        .btn-danger { background: transparent; color: var(--danger); border: 1px solid var(--danger); }
        .btn-danger:hover { background: rgba(248,113,113,0.1); }
        .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: var(--spacing-sm); margin-top: var(--spacing-sm); }
        textarea {
            width: 100%;
            min-height: 140px;
            background: var(--bg-elevated);
            border: 1px solid transparent;
            border-radius: var(--radius-card);
            padding: var(--spacing-md);
            color: var(--text-primary);
            font-family: var(--font-mono);
            font-size: calc(var(--size-body) * 0.875);
            resize: vertical;
            margin-bottom: var(--spacing-md);
        }
        textarea:focus { outline: none; border-color: var(--accent); }
        .history { display: grid; gap: var(--spacing-sm); max-height: 300px; overflow-y: auto; }
        .history-item {
            background: var(--bg-elevated);
            border-radius: 12px;
            padding: 10px 12px;
            font-family: var(--font-mono);
            font-size: calc(var(--size-body) * 0.8);
            word-break: break-all;
            color: var(--text-secondary);
            cursor: pointer;
        }
        .history-item:hover { background: var(--bg-overlay); color: var(--text-primary); }
        .history-time { display: block; font-family: var(--font-body); font-size: 12px; color: var(--text-secondary); margin-bottom: 2px; }
        .empty { text-align: center; color: var(--text-secondary); padding: var(--spacing-md); }
        .toast {
            position: fixed;
            top: var(--spacing-md);
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: var(--success);
            color: var(--bg-deep);
            padding: 12px 24px;
            border-radius: var(--radius-pill);
            font-weight: 600;
            opacity: 0;
            transition: all 0.3s;
            z-index: 1000;
        }
        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    </style>
</head>
<body>
    <div class="container">
        <h1>邀请链接提取器</h1>

        <div class="card">
            <div class="stats">
                <div class="stat-card">
                    <div class="stat-value" id="leftCount">0</div>
                    <div class="stat-label">剩余链接</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="usedCount">0</div>
                    <div class="stat-label">已提取</div>
                </div>
            </div>

            <div class="link-display" onclick="copyCurrent()">
                <div class="link-text" id="linkText">点击下方按钮提取链接</div>
                <div class="link-hint" id="linkHint">等待提取...</div>
            </div>
            <button class="btn" onclick="extractLink()">提取一条链接（自动复制）</button>
        </div>

        <div class="card">
            <div class="card-title">存入链接</div>
            <textarea id="importInput" placeholder="每行一条链接，可以一次粘贴很多条&#10;例如：&#10;https://example.com/invite?ref=AAA&#10;https://example.com/invite?ref=BBB"></textarea>
            <button class="btn" onclick="importLinks()">存入链接</button>
            <div class="btn-row">
                <button class="btn btn-secondary" onclick="exportLeft()">复制剩余全部</button>
                <button class="btn btn-danger" onclick="clearAll()">清空所有</button>
            </div>
        </div>

        <div class="card">
            <div class="card-title">提取记录（点击可再次复制）</div>
            <div class="history" id="history"></div>
            <div class="btn-row" style="grid-template-columns: 1fr;">
                <button class="btn btn-secondary" onclick="clearHistory()">清空记录</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        const POOL_KEY = 'invite_link_pool';
        const HISTORY_KEY = 'invite_link_history';
        let currentLink = '';

        function load(key) {
            try { return JSON.parse(localStorage.getItem(key)) || []; } catch (e) { return []; }
        }
        function save(key, value) {
            localStorage.setItem(key, JSON.stringify(value));
        }

        function escapeHtml(s) {
            return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        }

        function refresh() {
            const pool = load(POOL_KEY);
            const history = load(HISTORY_KEY);
            document.getElementById('leftCount').textContent = pool.length;
            document.getElementById('usedCount').textContent = history.length;

            const box = document.getElementById('history');
            if (history.length === 0) {
                box.innerHTML = '<div class="empty">还没有提取记录</div>';
                return;
            }
            box.innerHTML = history.slice().reverse().map((h, i) =>
                `<div class="history-item" data-i="${history.length - 1 - i}"><span class="history-time">${escapeHtml(h.time)}</span>${escapeHtml(h.link)}</div>`
            ).join('');
            box.querySelectorAll('.history-item').forEach(el => {
                el.onclick = () => copyText(history[el.dataset.i].link, '已复制这条链接');
            });
        }

        function copyText(text, msg) {
            const done = () => showToast(msg);
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
            } else {
                fallbackCopy(text, done);
            }
        }
        function fallbackCopy(text, done) {
            const ta = document.createElement('textarea');
            ta.value = text;
            ta.style.position = 'fixed';
            ta.style.opacity = '0';
            document.body.appendChild(ta);
            ta.select();
            try { document.execCommand('copy'); done(); } catch (e) { showToast('复制失败，请长按链接手动复制'); }
            document.body.removeChild(ta);
        }

        function extractLink() {
            const pool = load(POOL_KEY);
            if (pool.length === 0) {
                showToast('没有剩余链接了，请先存入');
                return;
            }
            const link = pool.shift();
            save(POOL_KEY, pool);
            const history = load(HISTORY_KEY);
            history.push({ link, time: new Date().toLocaleString('zh-CN') });
            save(HISTORY_KEY, history);

            currentLink = link;
            document.getElementById('linkText').textContent = link;
            document.getElementById('linkHint').textContent = '已自动复制，点击这里可再次复制';
            copyText(link, '已提取并复制');
            refresh();
        }

        function copyCurrent() {
            if (!currentLink) return;
            copyText(currentLink, '已复制');
        }

        function importLinks() {
            const input = document.getElementById('importInput');
            const lines = input.value.split(/\r?\n/).map(s => s.trim()).filter(Boolean);
            if (lines.length === 0) {
                showToast('请先粘贴链接');
                return;
            }
            const pool = load(POOL_KEY);
            const used = new Set(load(HISTORY_KEY).map(h => h.link));
            const exist = new Set(pool);
            let added = 0, skipped = 0;
            lines.forEach(l => {
                if (exist.has(l) || used.has(l)) { skipped++; return; }
                pool.push(l); exist.add(l); added++;
            });
            save(POOL_KEY, pool);
            input.value = '';
            showToast(skipped ? `存入 ${added} 条，跳过重复 ${skipped} 条` : `成功存入 ${added} 条`);
            refresh();
        }

        function exportLeft() {
            const pool = load(POOL_KEY);
            if (pool.length === 0) { showToast('没有剩余链接'); return; }
            copyText(pool.join('\n'), `已复制剩余 ${pool.length} 条`);
        }

        function clearAll() {
            if (!confirm('确定清空所有剩余链接吗？此操作不能撤销')) return;
            localStorage.removeItem(POOL_KEY);
            showToast('已清空剩余链接');
            refresh();
        }

        function clearHistory() {
            if (!confirm('确定清空提取记录吗？')) return;
            localStorage.removeItem(HISTORY_KEY);
            showToast('已清空记录');
            refresh();
        }

        function showToast(message) {
            const t = document.getElementById('toast');
            t.textContent = message;
            t.classList.add('show');
            clearTimeout(t._timer);
            t._timer = setTimeout(() => t.classList.remove('show'), 2000);
        }

        refresh();
    </script>
</body>
</html>
