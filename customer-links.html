    <style>
        :root {
            --bg-deep: #05070C;
            --bg-base: #0A0D12;
            --bg-raised: #0F131C;
            --bg-elevated: #161D2B;
            --bg-overlay: #1E2636;
            --accent: #6EE7B7;
            --accent-dim: #34D399;
            --text-primary: #F8FAFC;
            --text-secondary: #94A3B8;
            --success: #38BDF8;
            --danger: #F87171;
            --radius-pill: 999px;
            --radius-card: 16px;
            --spacing-sm: clamp(8px, 1.5vw, 12px);
            --spacing-md: clamp(16px, 3vw, 24px);
            --spacing-lg: clamp(24px, 4vw, 36px);
            --font-display: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            --size-display: clamp(24px, 5vw, 32px);
            --size-title: clamp(18px, 3.5vw, 22px);
            --size-body: clamp(14px, 2.5vw, 16px);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-body);
            font-size: var(--size-body);
            background: var(--bg-deep);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
            padding: var(--spacing-md);
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        h1 {
            font-family: var(--font-display);
            font-size: var(--size-display);
            font-weight: 600;
            letter-spacing: -0.02em;
            margin-bottom: var(--spacing-lg);
            text-align: center;
        }

        .card {
            background: var(--bg-raised);
            border-radius: var(--radius-card);
            padding: var(--spacing-lg);
            margin-bottom: var(--spacing-md);
        }

        .input-group {
            margin-bottom: var(--spacing-md);
        }

        label {
            display: block;
            margin-bottom: var(--spacing-sm);
            color: var(--text-secondary);
            font-size: calc(var(--size-body) * 0.875);
        }

        input[type="text"] {
            width: 100%;
            background: var(--bg-elevated);
            border: 1px solid transparent;
            border-radius: var(--radius-card);
            padding: 14px var(--spacing-md);
            color: var(--text-primary);
            font-size: var(--size-body);
        }

        input:focus {
            outline: none;
            border-color: var(--accent);
        }

        .customer-list {
            display: grid;
            gap: var(--spacing-sm);
            max-height: 65vh;
            overflow-y: auto;
        }

        .customer-item {
            background: var(--bg-elevated);
            border-radius: var(--radius-card);
            padding: var(--spacing-md);
        }

        .customer-name {
            font-weight: 600;
            font-size: var(--size-title);
            color: var(--accent);
            margin-bottom: var(--spacing-sm);
        }

        .links-grid {
            display: grid;
            gap: var(--spacing-sm);
        }

        .link-item {
            display: grid;
            gap: 6px;
        }

        .link-label {
            font-size: calc(var(--size-body) * 0.75);
            color: var(--text-secondary);
        }

        .link-display {
            background: var(--bg-overlay);
            border-radius: 12px;
            padding: 10px 12px;
            font-family: 'SF Mono', 'Monaco', 'Consolas', monospace;
            font-size: calc(var(--size-body) * 0.8);
            word-break: break-all;
            color: var(--success);
            cursor: pointer;
            transition: background 0.2s;
        }

        .link-display:hover {
            background: var(--bg-raised);
        }

        .empty-state {
            text-align: center;
            color: var(--text-secondary);
            padding: var(--spacing-lg);
        }

        .toast {
            position: fixed;
            top: var(--spacing-md);
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: var(--success);
            color: var(--bg-deep);
            padding: 12px 24px;
            border-radius: var(--radius-pill);
            font-weight: 600;
            opacity: 0;
            transition: all 0.3s;
            z-index: 1000;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        .stats {
            text-align: center;
            color: var(--text-secondary);
            margin-bottom: var(--spacing-md);
            font-size: calc(var(--size-body) * 0.875);
        }

        .stats-number {
            color: var(--accent);
            font-weight: 600;
            font-size: var(--size-title);
        }
    </style>
</head>

    <script>
        let allCustomers = PRELOADED_DATA || [];

        function handleSearch() {
            const keyword = document.getElementById('searchInput').value.trim().toLowerCase();

            if (!keyword) {
                renderList(allCustomers);
                document.getElementById('searchStats').textContent = '';
                return;
            }

            const filtered = allCustomers.filter(c =>
                c.name.toLowerCase().includes(keyword)
            );

            renderList(filtered);
            document.getElementById('searchStats').innerHTML =
                `, 找到 <span class="stats-number">${filtered.length}</span> 个匹配`;
        }

        function copyLink(link, customerName, linkNum) {
            if (navigator.clipboard) {
                navigator.clipboard.writeText(link).then(() => {
                    showToast(`已复制「${customerName}」的链接${linkNum}`);
                });
            } else {
                const textarea = document.createElement('textarea');
                textarea.value = link;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                showToast(`已复制「${customerName}」的链接${linkNum}`);
            }
        }

        function renderList(customers) {
            const container = document.getElementById('customerList');
            const totalCount = document.getElementById('totalCount');

            totalCount.textContent = allCustomers.length;

            if (customers.length === 0) {
                container.innerHTML = '<div class="empty-state">' +
                    (allCustomers.length === 0 ? '没有客户数据' : '没有找到匹配的客户') +
                    '</div>';
                return;
            }

            container.innerHTML = customers.map(customer => {
                const links = [];
                for (let i = 1; i <= 12; i++) {
                    if (customer[`link${i}`]) {
                        links.push({url: customer[`link${i}`], num: i});
                    }
                }

                return `
                    <div class="customer-item">
                        <div class="customer-name">${customer.name}</div>
                        <div class="links-grid">
                            ${links.map(link => `
                                <div class="link-item">
                                    <div class="link-label">链接 ${link.num}</div>
                                    <div class="link-display" onclick="copyLink('${link.url.replace(/'/g, "\\'")}', '${customer.name.replace(/'/g, "\\'")}', ${link.num})">${link.url}</div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2000);
        }

        renderList(allCustomers);
    </script>
